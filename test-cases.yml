  expected-result: |
    Пользователь должен перейти на страницу созданного турнира

- summary: |
    Проверка возможности пользователя играть с другом по ссылке
  requirement: |
    При нажатии на кнопку "Создать битву" пользователь может выбрать игру с другом и успешно создать приглашение на битву
  prerequisites:
    Открыта страница https://codebattle.hexlet.io/
  test-data: |
    Уровень - 1 звезда
    Тип игры - с другом
    Контроль времени - 8 минут
    Выбор опонента - ann006852
    Задание - случайная задача
    Теги - математика
  steps:
    - Нажимаем на кнопку "Создать битву"
    - Вводим тестовые данные
    - Нажимаем кнопку «Создать приглашение»
  expected-result: |
    В правом верхнем углу должно появиться сообщение об успешной отправке приглашения
    После принятия приглашения соперником у обоих игроков должно открыться окно созданной битвы

