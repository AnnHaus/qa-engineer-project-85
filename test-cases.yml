    Описание - Битва на JS для новичков
    Тип игры - с ботом
    Расписание и доступ:
    03.02.20026, 10.35
    public
    Особенности турнира - использовать чат
    Стратегия задач - random
    Поставщик задач - all
    Лимит игроков - 4
    Тип ранжирования - by_user
    Стратегия оценки - winn_loss
    Ограничения раундов - 2
    Круглые секунды тайм-аут - 177
    Секунды продолжительности перерыва 42
  steps:
    - Нажимаем на кнопку "Создать турнир"
