- summary: |
    Проверка завершения игры по истечению обратного отсчета таймера
  requirement: |
    После окончания работы таймера при отсутствии победителей игра завершается с нулевым результатом для обоих игроков
  prerequisites: |
    В браузере открыта страница https://codebattle.hexlet.io/
    Игроки не должны выполнить задание
  test-data: |
    Уровень - 1 звезда
    Тип игры - с пользователем
    Контроль времени - 2 минуты
    Задание - случайная задача
    Теги - математика
  steps:
    - Нажимаем на кнопку "создать битву"
    - Вводим тестовые данные
    - Нажимаем на кнопку "создать битву"
    - Переходим на страницу битвы
    - Ожидаем завершения работы таймера
  expected-result: |
    По достижению 45 секунда до окончания обратного отсчета таймер меняет цвет на желтый
    По достижению 15 секунда до окончания обратного отсчета таймер меняет цвет на красный
    После завершения работы таймера игра считается законченной
    В строке таймера появляется надпись Game Over
    Игрок остается на странице битвы
